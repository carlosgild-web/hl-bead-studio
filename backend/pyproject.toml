[project]
name = "hl-bead-studio-backend"
version = "0.1.0"
description = "Bead Studio backend: parametric glass beads and charms with an AI guide (FastAPI)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Also when ruff checks ../blender and ../scripts (CI), which import the backend.
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette asks TestClient users to move to httpx2. The stack keeps httpx (CLAUDE.md)
    # until the backend's SapClient decides otherwise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "freecad: needs freecadcmd (FREECAD_CMD); skipped when it is missing",
    "blender: needs blender (BLENDER_BIN); skipped when it is missing",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_covered = true
