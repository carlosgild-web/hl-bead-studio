# Every push and PR: lint and test both Python services and the frontend.
# No Ollama, API key, FreeCAD or Blender needed (the LLM is the scripted FakeClient;
# tests marked freecad or blender are skipped when the tool is missing).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, sap-mock]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: ruff on the Blender script and the repo scripts (backend settings)
        if: matrix.service == 'backend'
        run: ruff check ../blender ../scripts && ruff format --check ../blender ../scripts
      - name: pytest with coverage
        run: |
          pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md
          { echo "## ${{ matrix.service }} coverage (Python ${{ matrix.python }})"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
