# Every push and PR: lint and test both Python services and the frontend.
# No Ollama, API key, FreeCAD or Blender needed (the LLM is the scripted FakeClient;
# tests marked freecad or blender are skipped when the tool is missing).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, sap-mock]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: ruff on the Blender script and the repo scripts (backend settings)
        if: matrix.service == 'backend'
        run: ruff check ../blender ../scripts && ruff format --check ../blender ../scripts
      - name: pytest with coverage
        run: |
          pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md
          { echo "## ${{ matrix.service }} coverage (Python ${{ matrix.python }})"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"
      # The agent eval on the ideal FakeClient scripts (Phase 7) and on demo mode's answers
      # to the Q&A bank with every phrasing variant (decision 0022): every scenario must pass.
      - name: agent eval on Fake
        if: matrix.service == 'backend'
        run: |
          python -m app.cli agent-eval --fake --suite all --variants --out "$RUNNER_TEMP/eval"
          cat "$RUNNER_TEMP"/eval/*.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The design flow in a real browser, on the FakeClient (scripts/e2e_server.py: in-memory
  # SAP, a stand-in for Blender).
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
